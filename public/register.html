<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Complete Registration - Crypto Signals Bot</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        background: white;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 500px;
      }

      .header {
        text-align: center;
        margin-bottom: 30px;
      }

      .header h1 {
        color: #333;
        margin-bottom: 10px;
        font-size: 2.5em;
      }

      .header p {
        color: #666;
        font-size: 1.1em;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: #333;
        font-weight: 600;
      }

      input {
        width: 100%;
        padding: 15px;
        border: 2px solid #e1e5e9;
        border-radius: 10px;
        font-size: 16px;
        transition: border-color 0.3s ease;
      }

      input:focus {
        outline: none;
        border-color: #667eea;
      }

      .btn {
        width: 100%;
        padding: 15px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s ease;
      }

      .btn:hover {
        transform: translateY(-2px);
      }

      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }

      .alert {
        padding: 15px;
        border-radius: 10px;
        margin-bottom: 20px;
        display: none;
      }

      .alert-success {
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }

      .alert-error {
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }

      .token-info {
        background: #e3f2fd;
        padding: 15px;
        border-radius: 10px;
        margin-bottom: 20px;
        border-left: 4px solid #2196f3;
      }

      .token-info h3 {
        color: #1976d2;
        margin-bottom: 10px;
      }

      .token-info p {
        color: #424242;
        margin-bottom: 5px;
      }

      .loading {
        display: none;
        text-align: center;
        margin-top: 20px;
      }

      .spinner {
        border: 3px solid #f3f3f3;
        border-top: 3px solid #667eea;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        animation: spin 1s linear infinite;
        margin: 0 auto 10px;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>🚀 Complete Registration</h1>
        <p>Welcome to Crypto Signals Bot! Complete your registration below.</p>
      </div>

      <div id="tokenInfo" class="token-info" style="display: none">
        <h3>📱 Telegram Account Linked</h3>
        <p id="telegramInfo"></p>
        <p id="expiryInfo"></p>
      </div>

      <div id="alert" class="alert"></div>

      <form id="registrationForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            required
            minlength="3"
            maxlength="20"
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            required
            minlength="6"
          />
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            required
            minlength="6"
          />
        </div>

        <button type="submit" class="btn" id="submitBtn">
          Complete Registration
        </button>
      </form>

      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Completing registration...</p>
      </div>
    </div>

    <script>
      // Get token from URL
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');

      if (!token) {
        showAlert(
          'No registration token found. Please use the link from your Telegram bot.',
          'error',
        );
        document.getElementById('registrationForm').style.display = 'none';
      } else {
        // Validate token and show info
        validateToken(token);
      }

      async function validateToken(token) {
        try {
          const response = await fetch(
            `/api/auth/validate-registration-token/${token}`,
          );
          const data = await response.json();

          if (data.isValid) {
            showTokenInfo(data);
          } else {
            showAlert(
              data.error ||
                'Invalid or expired token. Please get a new one from your bot.',
              'error',
            );
            document.getElementById('registrationForm').style.display = 'none';
          }
        } catch (error) {
          showAlert('Error validating token. Please try again.', 'error');
          document.getElementById('registrationForm').style.display = 'none';
        }
      }

      function showTokenInfo(data) {
        document.getElementById('telegramInfo').textContent =
          `Telegram ID: ${data.telegramId}`;
        if (data.expiresIn) {
          document.getElementById('expiryInfo').textContent =
            `Expires: ${new Date(data.expiresIn).toLocaleString()}`;
        }
        document.getElementById('tokenInfo').style.display = 'block';
      }

      function showAlert(message, type) {
        const alert = document.getElementById('alert');
        alert.textContent = message;
        alert.className = `alert alert-${type}`;
        alert.style.display = 'block';
      }

      function hideAlert() {
        document.getElementById('alert').style.display = 'none';
      }

      document
        .getElementById('registrationForm')
        .addEventListener('submit', async (e) => {
          e.preventDefault();

          const username = document.getElementById('username').value;
          const password = document.getElementById('password').value;
          const confirmPassword =
            document.getElementById('confirmPassword').value;

          if (password !== confirmPassword) {
            showAlert('Passwords do not match!', 'error');
            return;
          }

          // Show loading
          document.getElementById('loading').style.display = 'block';
          document.getElementById('submitBtn').disabled = true;

          try {
            const response = await fetch(
              `/api/auth/complete-registration/${token}`,
              {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                  username,
                  password,
                }),
              },
            );

            const data = await response.json();

            if (response.ok) {
              showAlert(
                'Registration completed successfully! You can now return to your Telegram bot.',
                'success',
              );
              document.getElementById('registrationForm').style.display =
                'none';
            } else {
              showAlert(
                data.message || 'Registration failed. Please try again.',
                'error',
              );
            }
          } catch (error) {
            showAlert(
              'Error completing registration. Please try again.',
              'error',
            );
          } finally {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('submitBtn').disabled = false;
          }
        });

      // Auto-hide alerts after 5 seconds
      setInterval(() => {
        hideAlert();
      }, 5000);
    </script>
  </body>
</html>
